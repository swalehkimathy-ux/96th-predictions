<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>96th Predictions</title>
<style>
:root{
  --bg0:#050a18; --bg1:#0a1430; --card:#0d1836; --card2:#0a1226;
  --line:#1d2c55; --line2:#152142;
  --gold:#d9a83c; --gold2:#f0cd6e; --golddim:rgba(217,168,60,.14);
  --tx:#eef2fa; --sub:#8fa0c5; --dim:#5b6a8f;
  --grn:#2fbf71; --red:#e0604f; --amb:#e5b54a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:radial-gradient(1100px 560px at 50% -12%, #16265c 0%, var(--bg1) 46%, var(--bg0) 100%) fixed;
  color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
.hidden{display:none!important}
.ic{width:16px;height:16px;flex:none}
b{font-weight:700}

/* ============ SPLASH ============ */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(900px 500px at 50% 20%, #101d47 0%, var(--bg1) 45%, var(--bg0) 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease}
#splash.gone{opacity:0;pointer-events:none}
.splash-ball{width:118px;height:118px;filter:drop-shadow(0 0 34px rgba(217,168,60,.45));animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.splash-word{font-size:22px;font-weight:800;letter-spacing:.42em;color:#fff;text-indent:.42em}
.splash-sub{font-size:10.5px;color:var(--sub);letter-spacing:.14em;margin-top:-8px}
.splash-bar{width:170px;height:3px;background:#182a55;border-radius:3px;overflow:hidden;margin-top:14px}
.splash-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));animation:load 1.9s ease forwards}
@keyframes load{to{width:100%}}

/* ============ SHELL ============ */
#app{max-width:820px;margin:0 auto;padding:0 0 74px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 16px;background:rgba(5,10,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand .ball{width:30px;height:30px}
.brand b{font-size:14px;letter-spacing:.18em}
.brand span{color:var(--gold2);letter-spacing:.26em;font-size:10.5px}
.top-right{display:flex;gap:7px;align-items:center}
.chip{display:flex;gap:7px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:11.5px;color:var(--tx)}
.lv{display:inline-flex;gap:7px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.1em;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:var(--card);cursor:pointer}
.lv .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.lv.gold{color:var(--gold2);border-color:rgba(217,168,60,.55);background:var(--golddim)}
.lv.gold .dot{background:var(--grn);box-shadow:0 0 7px var(--grn);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.iconbtn{display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--gold2);cursor:pointer}
.iconbtn .ic{width:15px;height:15px}
.iconbtn.spin .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#content{padding:16px 16px 0}

/* ============ TABBAR ============ */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
  background:rgba(8,13,30,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);max-width:820px;margin:0 auto}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 13px;
  background:none;border:none;color:var(--dim);font-size:10px;font-weight:700;letter-spacing:.12em;cursor:pointer}
.tabbar button .ic{width:20px;height:20px}
.tabbar button.active{color:var(--gold2)}
.tabbar button.active .ic{filter:drop-shadow(0 0 8px rgba(217,168,60,.5))}

/* ============ SECTIONS ============ */
.sec-h{display:flex;align-items:baseline;gap:9px;margin:18px 2px 10px}
.sec-h:first-child{margin-top:4px}
.sec-h b{font-size:12px;letter-spacing:.16em;color:var(--gold2)}
.sec-h .cnt{font-size:11px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.sub2{font-size:10px;color:var(--dim);letter-spacing:.06em}

/* ============ RESEARCH BAR ============ */
.resbar{display:flex;align-items:center;gap:9px;background:linear-gradient(165deg,#0f1e46 0%,#0c1530 100%);
  border:1px solid var(--line);border-radius:13px;padding:10px 13px;font-size:10.5px;color:var(--sub);letter-spacing:.04em;flex-wrap:wrap}
.resbar .ic{width:14px;height:14px;color:var(--gold2)}
.resbar b{color:var(--tx)}
.resbar .sep{color:var(--line);margin:0 2px}

/* ============ COMBO HERO ============ */
.hero{background:linear-gradient(165deg,#13224e 0%,#0d1836 60%);border:1px solid rgba(217,168,60,.5);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-40px;right:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(217,168,60,.16),transparent 70%)}
.hero-tag{display:inline-flex;gap:7px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.12em;color:#0d1531;background:linear-gradient(135deg,#f6d87e,var(--gold));border-radius:7px;padding:5px 11px;margin-bottom:15px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:relative}
.hg{background:rgba(8,13,30,.5);border:1px solid var(--line2);border-radius:13px;padding:12px}
.hg .l{font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.hg .v{font-size:26px;font-weight:800;color:var(--gold2);margin-top:3px}
.hg .v.pct{color:var(--tx)}
.hg .bar{width:100%;height:6px;background:#182a55;border-radius:4px;overflow:hidden;margin-top:8px}
.hg .fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.legs{margin-top:15px;position:relative}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line2)}
.leg:last-child{border-bottom:none}
.leg .ln{flex:none;width:20px;height:20px;border-radius:6px;background:var(--golddim);border:1px solid rgba(217,168,60,.4);color:var(--gold2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.leg .li{flex:1;min-width:0}
.leg .li b{display:block;font-size:13px;line-height:1.25}
.leg .li span{font-size:11px;color:var(--sub)}
.leg .lo{flex:none;text-align:right}
.leg .lo .o{font-size:15px;font-weight:800;color:var(--gold2)}
.leg .lo .c{font-size:10px;color:var(--dim)}
.hero-status{display:flex;justify-content:space-between;align-items:center;margin-top:15px;position:relative;gap:8px;flex-wrap:wrap}
.hero-src{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.srcchip{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--sub);background:rgba(8,13,30,.5);white-space:nowrap}

.st{display:inline-flex;gap:5px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.08em;border-radius:8px;padding:5px 11px}
.st .ic{width:13px;height:13px}
.st.win{color:var(--grn);background:rgba(47,191,113,.14);border:1px solid rgba(47,191,113,.45)}
.st.loss{color:var(--red);background:rgba(224,96,79,.14);border:1px solid rgba(224,96,79,.45)}
.st.pend{color:var(--amb);background:rgba(229,181,74,.12);border:1px solid rgba(229,181,74,.4)}
.st.void{color:var(--dim);background:rgba(91,106,143,.16);border:1px solid rgba(91,106,143,.45)}
.st.sm{padding:3px 8px;font-size:9px;border-radius:6px}
.st.sm .ic{width:11px;height:11px}

/* ============ ODDS GAUGE (1.6–3.0) ============ */
.gauge{position:relative;height:8px;background:#182a55;border-radius:5px;margin-top:10px;overflow:visible}
.gauge-zone{position:absolute;top:0;bottom:0;background:rgba(47,191,113,.30);border-left:1px solid rgba(47,191,113,.7);border-right:1px solid rgba(47,191,113,.7)}
.gauge-pin{position:absolute;top:-4px;width:3px;height:16px;background:var(--gold2);border-radius:2px;box-shadow:0 0 8px rgba(240,205,110,.9)}
.gauge-ticks{position:relative;height:12px;margin-top:3px;font-size:8.5px;color:var(--dim);letter-spacing:.05em}
.gauge-ticks span{position:absolute;transform:translateX(-50%)}

/* warn */
.warnbox{margin-top:12px;background:rgba(229,181,74,.08);border:1px solid rgba(229,181,74,.4);border-radius:11px;padding:10px 12px;font-size:11px;color:#f0d9a0;line-height:1.55;position:relative}
.warnbox b{color:#ffe3a1}

/* ============ BEST PICKS TABLE ============ */
.bpt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.bpt-row{padding:12px 14px;border-bottom:1px solid var(--line2)}
.bpt-row:last-child{border-bottom:none}
.bpt-r1{display:flex;align-items:center;gap:10px}
.bpt-n{flex:none;width:22px;height:22px;border-radius:7px;background:var(--golddim);border:1px solid rgba(217,168,60,.4);color:var(--gold2);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.bpt-m{flex:1;min-width:0}
.bpt-m b{display:block;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bpt-m span{font-size:10px;color:var(--dim);letter-spacing:.03em}
.bpt-r1 .o{flex:none;font-size:16px;font-weight:800;color:var(--gold2)}
.bpt-r2{display:flex;align-items:center;gap:10px;margin-top:8px;padding-left:32px}
.bpt-k{flex:1;min-width:0;font-size:10.5px;color:var(--sub);line-height:1.35}
.bpt-k b{display:block;color:var(--gold2);font-size:10px;letter-spacing:.07em}
.bpt-cf{flex:none;width:88px}
.bpt-cf .bar{height:5px;background:#182a55;border-radius:3px;overflow:hidden}
.bpt-cf .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bpt-cf .t{font-size:10px;color:var(--sub);margin-top:3px;text-align:right;font-weight:700}
.bpt-s{flex:none;text-align:center;min-width:40px;background:rgba(47,191,113,.10);border:1px solid rgba(47,191,113,.4);border-radius:10px;padding:5px 0}
.bpt-s b{display:block;font-size:13px;color:var(--grn)}
.bpt-s span{font-size:7.5px;letter-spacing:.08em;color:var(--dim)}
.bpt-total{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(165deg,#13224e 0%,#0d1836 60%);border-top:1px solid rgba(217,168,60,.45);padding:11px 14px}
.bpt-total .lbl{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:#0d1531;background:linear-gradient(135deg,#f6d87e,var(--gold));border-radius:6px;padding:4px 9px}
.bpt-total .item{font-size:9px;color:var(--sub);letter-spacing:.08em}
.bpt-total .item b{display:block;font-size:16px;color:var(--gold2);letter-spacing:0;margin-top:1px}
.bpt-note{font-size:9.5px;color:var(--dim);letter-spacing:.05em;margin:9px 2px 0;line-height:1.55}

/* fixtures za leo — NDANI ya gold table */
.fx-sec{display:flex;gap:8px;align-items:center;margin-top:15px;padding-top:12px;border-top:1px solid rgba(217,168,60,.35);
  font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--gold2)}
.fx-sec .ic{width:14px;height:14px}
.fx-sec-note{font-weight:500;letter-spacing:.02em;color:var(--dim);font-size:9px}
.fxrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.fx-t{flex:none;font-size:10.5px;color:var(--gold2);font-weight:700;background:var(--golddim);border:1px solid rgba(217,168,60,.35);border-radius:6px;padding:3px 7px;letter-spacing:.03em}
.fx-m{flex:1;min-width:0}
.fx-m b{display:block;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-m .sub2{font-size:9.5px}
.fx-pick{flex:none;display:flex;gap:6px;align-items:center;font-size:10px;color:var(--grn);border:1px solid rgba(47,191,113,.4);background:rgba(47,191,113,.10);border-radius:7px;padding:3px 8px;white-space:nowrap}
.fx-pick b{color:var(--grn)}
.fx-cf{color:var(--dim);font-size:9px}
.fx-none{flex:none;color:var(--dim);font-size:10px;font-style:italic}
.fx-total{display:flex;gap:10px;align-items:center;margin-top:12px;background:linear-gradient(135deg,rgba(246,216,126,.16),rgba(217,168,60,.08));
  border:1px solid rgba(217,168,60,.5);border-radius:11px;padding:9px 13px}
.fx-total span{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--gold2)}
.fx-total b{font-size:22px;font-weight:800;color:var(--gold2)}
.fx-total .sub2{margin-left:auto;text-align:right}
.manual-tag{font-size:8px;color:var(--dim);letter-spacing:.06em;margin-left:5px}

/* others */
details.dtl{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-top:12px}
details.dtl summary{cursor:pointer;display:flex;gap:9px;align-items:center;padding:11px 0;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sub);list-style:none}
details.dtl summary::-webkit-details-marker{display:none}
details.dtl summary .ic{width:14px;height:14px;color:var(--dim)}
.dtl-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:12px}
.dtl-row:last-child{border-bottom:none}
.dtl-row .po{font-weight:800;color:var(--gold2);white-space:nowrap}
.dtl-row .pc{color:var(--dim);font-size:11px;white-space:nowrap}

/* ============ WIN RATE ============ */
.wr-hero{background:linear-gradient(165deg,#13224e 0%,#0d1836 60%);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}
.wr-hero .big{font-size:52px;font-weight:800;color:var(--gold2);line-height:1}
.wr-hero .lbl{font-size:11px;letter-spacing:.2em;color:var(--sub);margin-top:6px}
.wr-hero .subnote{font-size:11px;color:var(--dim);margin-top:10px}
.wr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;margin-top:14px}
.wr-cell{background:rgba(8,13,30,.5);border:1px solid var(--line2);border-radius:12px;padding:11px;text-align:center}
.wr-cell .v{font-size:19px;font-weight:800}
.wr-cell .v.grn{color:var(--grn)} .wr-cell .v.red{color:var(--red)} .wr-cell .v.amb{color:var(--amb)} .wr-cell .v.gold{color:var(--gold2)}
.wr-cell .l{font-size:8.5px;letter-spacing:.08em;color:var(--dim);margin-top:3px}
.mktstats{margin-top:12px}
.mktrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:11.5px}
.mktrow:last-child{border-bottom:none}
.mktrow .mn{color:var(--sub)}
.mktrow .mv{font-weight:800;color:var(--tx);white-space:nowrap}
.mktrow .mv em{font-style:normal;color:var(--dim);font-weight:600;font-size:10px}

/* day list */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:11px;overflow:hidden}
.day-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
.day-del{flex:none;width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
.day-del:hover{color:var(--red);border-color:var(--red)}
.day-del .ic{width:13px;height:13px}
.clear-hist{margin-left:10px;flex:none;font-size:8.5px;font-weight:700;letter-spacing:.08em;color:var(--red);
  background:rgba(231,76,60,.08);border:1px solid rgba(231,76,60,.35);border-radius:6px;padding:4px 9px;cursor:pointer}
.clear-hist:active{background:rgba(231,76,60,.18)}
.day-h .d{flex:1;min-width:0}
.day-h .d b{display:block;font-size:13px}
.day-h .d span{font-size:10.5px;color:var(--dim);letter-spacing:.04em;display:block;margin-top:2px}
.day-b{padding:0 14px 14px;border-top:1px solid var(--line2)}
.legrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.legrow:last-child{border-bottom:none}
.legrow .pm{font-weight:600}
.legrow .ps{color:var(--sub);font-size:11px}
.legrow .po{font-weight:800;color:var(--gold2)}
.legrow .sc{color:var(--gold2);font-weight:700}
.ovr{display:inline-flex;gap:4px}
.ovr button{width:26px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:10px;font-weight:800;cursor:pointer}
.ovr button.on-w{background:rgba(47,191,113,.18);border-color:var(--grn);color:var(--grn)}
.ovr button.on-l{background:rgba(224,96,79,.18);border-color:var(--red);color:var(--red)}
.ovr button.on-v{background:rgba(91,106,143,.25);border-color:var(--dim);color:var(--sub)}
.scorein{display:flex;gap:6px;align-items:center}
.scorein input{width:64px;background:var(--card2);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:6px 8px;font-size:12px;text-align:center}
.scorein input.bad{border-color:var(--red)}
.scorein button{background:var(--golddim);border:1px solid rgba(217,168,60,.4);color:var(--gold2);border-radius:8px;padding:6px 11px;font-size:10.5px;font-weight:800;cursor:pointer}
.auto-tag{font-size:8.5px;font-weight:800;letter-spacing:.08em;color:var(--gold2);background:var(--golddim);border:1px solid rgba(217,168,60,.4);border-radius:5px;padding:1.5px 5px;margin-left:6px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px 16px;text-align:center;color:var(--sub);font-size:12.5px}
.empty b{display:block;margin-bottom:8px;color:var(--tx)}
.foot{margin:24px 2px 0;color:var(--dim);font-size:10px;line-height:1.7;letter-spacing:.04em}

#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f6d87e,var(--gold));color:#0d1531;font-weight:800;font-size:12px;padding:11px 22px;border-radius:11px;box-shadow:0 14px 40px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>

<svg width="0" height="0" xmlns:xlink="http://www.w3.org/1999/xlink" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-ball" viewBox="0 0 48 48">
  <circle cx="24" cy="24" r="21.5" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <polygon points="24,13.5 33.9,20.7 30.1,32.3 17.9,32.3 14.1,20.7" fill="none" stroke="currentColor" stroke-width="1.9"/>
  <path d="M24 13.5V6.5M33.9 20.7l6.9-2.5M30.1 32.3l4.2 5.9M17.9 32.3l-4.2 5.9M14.1 20.7 7.2 18.2" stroke="currentColor" stroke-width="1.9" fill="none"/>
</symbol>

}
function saveRecords(r){ store.setItem(RKEY, JSON.stringify(r)); }

/* ============ NET ============ */
function fetchT(url, opts, ms){
  var c = new AbortController();

  var o = {}; for(var k in (opts||{})) o[k] = opts[k];

function apiFetch(path, opts){
  function attempt(i){
    if(i >= attempts.length) return Promise.reject(new Error("api unavailable"));
    var u = attempts[i];
    return fetchT(u, opts, 160000).then(function(r){
      if(!r.ok) throw new Error("http " + r.status);
      var ct = (r.headers.get("content-type") || "").toLowerCase();
      if(ct && ct.indexOf("json") < 0) throw new Error("si-json");
      API_BASE = (u === path) ? "" : API_URL;
      return r;
    }, function(e){
      if(i + 1 < attempts.length) return attempt(i + 1);
      throw e;
    });
  }
  var attempts = API_BASE ? [API_BASE + path] : [path, API_URL ? API_URL + path : null].filter(function(x){ return x; });
  return attempt(0);
}
function apiGet(path){ return apiFetch(path, {cache:"no-store"}).then(function(r){ return r.json(); }); }

/* ============ PICKS (sorted by confidence) ============ */
function pickObj(m, p){
  return {
    mid:m.id, match:m.home + " – " + m.away, comp:m.comp, kickoff:m.kickoff,
    type:p.type, market:p.market, selection:p.selection, odds:p.odds, final:p.final,
    n:p.n, src:p.src || [], flag:p.flag, score:null, status:"pending", manual:false, auto:false
  };
}
function srvPick(p){
  return {
    mid:p.mid, match:p.match, comp:p.comp || "", kickoff:p.kickoff || 0,
    type:p.type, market:p.market, selection:p.selection, odds:p.odds, final:p.final,
    n:p.n || 0, src:p.src || [], flag:"ok", score:null, status:"pending", manual:false, auto:false
  };
}
function allPicks(){
  var out = [];
  (DATA.matches || []).forEach(function(m){
    (m.picks || []).forEach(function(p){
      if(!p.odds) return;
      out.push(pickObj(m, p));
    });
  });
  out.sort(function(a,b){ return b.final - a.final; });
  return out;
}

/* ============ ACCUMULATOR (bet ya siku) ============
   Kanuni (server ndiyo source ya kweli):
   - legs makuu: conf >= 80%
   - total lazima iwe 1.6–3.0 · legs <= 10
   - 80%+ hazijafikia 1.6 → jumlisha picks 70–80% */
function buildAccumulator(){
  var all = allPicks();
  if(DATA && DATA.acc && Array.isArray(DATA.acc.legs) && DATA.acc.legs.length){
    var legs = DATA.acc.legs.map(srvPick);
    var used = {}; legs.forEach(function(l){ used[l.mid] = 1; });
    var hitProb = 1; legs.forEach(function(l){ hitProb *= l.final; });
    return {legs:legs, total:DATA.acc.total || 1, min_met:!!DATA.acc.min_met,
            hitProb:hitProb, others:all.filter(function(p){ return !used[p.mid]; }), server:true};
  }
  if(!all.length) return {legs:[], total:1, min_met:false, hitProb:0, others:[], server:false};
  var now = Date.now();
  var up = all.filter(function(p){ return p.kickoff + 30*60000 > now; });
  var pool = up.length ? up : all;
  var seen = {}, uniq = [];
  pool.forEach(function(p){ if(!seen[p.mid]){ seen[p.mid] = 1; uniq.push(p); } });
  var primary = uniq.filter(function(p){ return p.final >= ACC_CONF; });
  var secondary = uniq.filter(function(p){ return p.final < ACC_CONF; });
  var legs2 = [], tot = 1;
  function fill(pool2){
    pool2.forEach(function(p){
      if(legs2.length >= ACC_MAX_LEGS) return;
      if(tot * p.odds <= ODDS_MAX + 1e-9){ legs2.push(p); tot *= p.odds; }
    });
  }
  fill(primary);
  if(tot < ODDS_MIN - 1e-9) fill(secondary);
  var hit2 = 1; legs2.forEach(function(l){ hit2 *= l.final; });
  var used2 = {}; legs2.forEach(function(l){ used2[l.mid] = 1; });
  return {legs:legs2, total:tot, min_met:tot >= ODDS_MIN - 1e-9, hitProb:hit2,
          others:uniq.filter(function(p){ return !used2[p.mid]; }), server:false};
}

    if(LIVE.state === "live"){ apiPost("/api/sessions",{session:s}).catch(function(){}); }
  } else if(LIVE.state === "live" && acc.legs.length && !sessionHasResults(s) && picksKey(s.picks) !== picksKey(acc.legs)){
    /* data mpya ya live → rufunge bet ya siku (session bado haina matoleo yaliyorekodiwa) */
    s.picks = acc.legs; s.others = acc.others;
    s.meta = {auto:true, legs:acc.legs.length, total:acc.total, min_met:acc.min_met, matches:(DATA.matches||[]).length};
    saveRecords(rec);
    apiPost("/api/sessions",{session:s}).catch(function(){});
  }
  return s;
}
function mergeServerResults(serverSessions){
  var rec = loadRecords(); var changed = false;
  (serverSessions || []).forEach(function(ss){
    var loc = rec.sessions.filter(function(s){ return s.id === ss.id; })[0];
    if(!loc){ rec.sessions.push(ss); changed = true; return; }
    (ss.picks || []).forEach(function(sp){
      var lp = loc.picks.filter(function(p){ return p.mid === sp.mid && p.market === sp.market; })[0];
      if(!lp) return;
      if(sp.manual && sp.status && sp.status !== "pending" && !lp.manual){ lp.manual = true; lp.status = sp.status; changed = true; }
      if(sp.score && !lp.manual && lp.status === "pending"){
        var m = String(sp.score).match(/(\d+)\s*[-:]?\s*(\d+)/);
        if(m){ lp.score = sp.score; lp.status = evalPick(lp.type, +m[1], +m[2]); lp.auto = true; changed = true; }
      }
    });
  });
  if(changed) saveRecords(rec);
  return changed;
}
function evalPick(t, h, a){
  if(t === "DC1X") return h >= a ? "win" : "loss";
  if(t === "DCX2") return a >= h ? "win" : "loss";
  if(t === "O15")  return h + a >= 2 ? "win" : "loss";
  if(t === "U35")  return h + a <= 3 ? "win" : "loss";
  if(t === "BTTS") return (h > 0 && a > 0) ? "win" : "loss";
  return "pending";
}

/* ============ COMBO RESULT (accumulator: zote lazima zikite) ============ */
function dayResult(picks){
  var legs = (picks || []).filter(function(p){ return p.status !== "void"; });
  if(!legs.length) return "void";
  var hasLoss = false, allWin = true;
  legs.forEach(function(p){
    if(p.status === "loss") hasLoss = true;
    if(p.status !== "win") allWin = false;
  });
  if(hasLoss) return "loss";
  if(allWin) return "win";
  return "pending";
}

/* ============ WIN RATE (day-based, accumulator) ============ */
function dayBets(rec){
  return rec.sessions.map(function(s){ return (s.picks && s.picks.length) ? {id:s.id, date:s.date, started_at:s.started_at, picks:s.picks, total:(s.meta&&s.meta.total)||0} : null; })
    .filter(Boolean).sort(function(a,b){ return (b.started_at||0)-(a.started_at||0); });
}
function winRate(rec){
  var bets = dayBets(rec);
  var w=0,l=0,pend=0, legsSum=0, totSum=0, winsLegs=0;
  bets.forEach(function(x){
    var r = dayResult(x.picks);
    if(r==="win") w++; else if(r==="loss") l++; else if(r==="pending") pend++;
    legsSum += x.picks.length; totSum += (x.total || 0);
    winsLegs += x.picks.filter(function(p){ return p.status === "win"; }).length;
  });
  var streak=0, stype=null;
  bets.forEach(function(x){
    var r = dayResult(x.picks);
    if(r==="win"){ if(stype!=="loss") streak++; stype="win"; }
    else if(r==="loss"){ if(stype!=="win") streak++; stype="loss"; }
  });
  return {w:w,l:l,pend:pend,rate:(w+l)?w/(w+l):null,streak:streak,streakType:stype,days:bets.length,
          avgLegs:bets.length?legsSum/bets.length:0, avgTotal:bets.length?totSum/bets.length:0,
          legsSum:legsSum, winsLegs:winsLegs};
}
function marketStats(rec){
  var mkt = {};
  rec.sessions.forEach(function(s){
    (s.picks||[]).forEach(function(p){
      var k = p.market || "—";
      mkt[k] = mkt[k] || {w:0,l:0};
      if(p.status === "win") mkt[k].w++;
      else if(p.status === "loss") mkt[k].l++;
    });
  });
  return mkt;
}

/* ============ AUTO-SCORE (client → /api/score → WC final scores) ============
   Kazi hata ikiwa server DB imetoweka: client huiita moja kwa moja kwa kila pick
   iliyopita kickoff+120min ambayo bado iko 'pending'. */
var _scoreCache = {};
function autoScorePicks(){
  var now = Date.now();
  var rec = loadRecords();
  var targets = [];
  rec.sessions.forEach(function(s){
    (s.picks||[]).forEach(function(p){
      if(!p.mid || p.mid.indexOf(" ") >= 0 || p.mid.indexOf("/") >= 0) return;
      if(p.manual) return;
      if(p.status && p.status !== "pending") return;
      if(now < (p.kickoff || 0) + 120*60000) return;
      var c = _scoreCache[p.mid];
      if(c && !c.finished && now - c.ts < 15*60000) return;
      targets.push({sid:s.id, mid:p.mid, market:p.market});
    });
  });
  if(!targets.length) return;
  targets.slice(0, 10).forEach(function(t){
    _scoreCache[t.mid] = {ts: Date.now(), finished:false};
    apiGet("/api/score?mid=" + encodeURIComponent(t.mid)).then(function(r){
      if(!(r && r.ok)) return;
      if(r.finished && r.score){
        _scoreCache[t.mid] = {ts: Date.now(), finished:true};
        var rec2 = loadRecords();
        var s2 = rec2.sessions.filter(function(x){ return x.id === t.sid; })[0];
        if(!s2) return;
        var changed = false;
        s2.picks.forEach(function(p){
          if(p.mid === t.mid && !p.manual && p.status !== "win" && p.status !== "loss" && p.status !== "void"){
            var mm = String(r.score).match(/^(\d{1,2})\s*-\s*(\d{1,2})$/);
            if(mm){ p.score = r.score; p.status = evalPick(p.type, +mm[1], +mm[2]); p.auto = true; changed = true; }
          }
        });
        if(changed){
          saveRecords(rec2);
          try{ apiPost("/api/sessions", {session:s2}).catch(function(){}); }catch(e){}
          if(curTab === "history") renderHistory(); else renderToday();
        }
      }
    }).catch(function(){});
  });
}

    var hits = x.picks.filter(function(p){ return p.status === "win"; }).length;
    var decided = x.picks.filter(function(p){ return p.status === "win" || p.status === "loss"; }).length;
    h.push('<div class="day">');
    h.push('<div class="day-h" data-open="' + idx + '"><div class="d"><b>' + hits + '/' + x.picks.length + ' LEGS ZIMEITA · TOTAL ' + (x.total ? x.total.toFixed(2) : "—") + '</b>' +
      '<span>' + sessDateLabel({date:x.date}) + ' · ' + (x.picks[0] ? esc(x.picks[0].match) : "") + (x.picks.length>1 ? ' +' + (x.picks.length-1) : '') +
      (decided < x.picks.length ? ' · ' + (x.picks.length - decided) + ' bado' : '') + '</span></div>' + rchip +
      '<button class="day-del" data-del="' + idx + '" title="Futa record hii"><svg class="ic"><use href="#i-x" xlink:href="#i-x"/></svg></button></div>');
    h.push('<div class="day-b" style="display:' + (idx===0?'block':'none') + '" data-body="' + idx + '">');
    x.picks.forEach(function(p){
      var pkey = p.mid + "|" + p.market;
      h.push('<div class="legrow"><span style="flex:1;min-width:0"><span class="pm">' + esc(p.match) + '</span><br>' +
        '<span class="ps">' + esc(p.market) + (p.score ? ' · <span class="sc">' + esc(p.score) + '</span>' : '') + (p.auto ? ' <span class="auto-tag">AUTO</span>' : '') + (p.manual ? ' <span class="auto-tag">MANUAL</span>' : '') + '</span></span>' +
        '<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span class="po">' + p.odds.toFixed(2) + '</span> ' +
        (p.status && p.status !== "pending" ? comboStatusChip(p.status, true) : '') +
        '<span class="ovr">' +
          '<button class="ov' + (p.status==="win"?" on-w":"") + '" data-mode="w" data-date="' + esc(x.date) + '" data-p="' + esc(pkey) + '">W</button>' +
          '<button class="ov' + (p.status==="loss"?" on-l":"") + '" data-mode="l" data-date="' + esc(x.date) + '" data-p="' + esc(pkey) + '">L</button>' +
          '<button class="ov' + (p.status==="void"?" on-v":"") + '" data-mode="v" data-date="' + esc(x.date) + '" data-p="' + esc(pkey) + '">V</button>' +
        '</span></span></div>');
      h.push('<div class="scorein" style="margin-top:8px;opacity:.85"><span class="manual-tag">BACKUP (auto ndiyo msingi)</span><input data-date="' + esc(x.date) + '" data-mid="' + esc(p.mid) + '" data-mkt="' + esc(p.market) + '" value="' + esc(p.score||"") + '" placeholder="score h-a" inputmode="numeric">' +
        '<button class="scorebtn" data-date="' + esc(x.date) + '" data-mid="' + esc(p.mid) + '" data-mkt="' + esc(p.market) + '">FUNGA</button></div>');
    });
    h.push('</div></div></div>');
  });
  h.push('<p class="foot">MATOKEO YANAJAA YENYewe (WinComparator final scores) — hakuna kuingiza manual isipokuwa fallback · kila sync (~60s) inatafuta scores mpya · records: kifaa hii + server (backup) · UCHEZA KWA UHAKIKA</p>');
  $("tab-history").innerHTML = h.join("");
}

function renderAll(){ renderTopbar(); renderLiveChip(); renderToday(); renderHistory(); }

/* ============ AUTO-SYNC ============ */
function markSync(){
  var el = $("synctxt");
  if(el) el.textContent = new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  var rb = $("btn-refresh");
  if(rb) rb.classList.remove("spin");
}
function setSyncing(on){
  var rb = $("btn-refresh");
  if(rb) rb.classList.toggle("spin", !!on);
}
function autoSync(){
  if(document.hidden) return;
  var now = Date.now();
  if(LIVE.state === "live"){
    setSyncing(true);
    apiGet("/api/sessions").then(function(d){
      if(d && d.ok){
        var ch = mergeServerResults(d.sessions);
        if(ch){ if(curTab === "history") renderHistory(); else renderToday(); }
        markSync();
      }
    }).catch(function(){}).then(function(){ setSyncing(false); });
  }
  if(now - lastPicksPoll > 2 * 60000){
    lastPicksPoll = now;
    /* siku mpya → force research ya siku hiyo hiyo */
    var force = !!(lastDataDate && lastDataDate !== localDateStr());
    fetchLive(force).then(function(d){
      if(d && !document.hidden){
        setLiveFrom(d);
        ensureTodaySession();
        markSync();
        if(curTab === "today") renderToday(); else renderHistory();
      }
    });
  }
  /* auto results (WC) kwa picks zilizopita kickoff+120min — kila sync */
  autoScorePicks();
}
function startAutoSync(){ setInterval(autoSync, 60000); }

function refreshAll(){
  toast("INARUDISHA DATA...");
  var force = !!(lastDataDate && lastDataDate !== localDateStr());
  fetchLive(true).then(function(d){
    setLiveFrom(d);
    if(d) toast("DATA MPYA · " + (LIVE.at || "sasa"));
    ensureTodaySession();
    if(curTab === "today") renderToday(); else renderHistory();
  });
}

/* ============ TABS ============ */
function switchTab(t){
  curTab = t;
  $("tb-today").classList.toggle("active", t === "today");
  $("tb-history").classList.toggle("active", t === "history");
  $("tab-today").classList.toggle("hidden", t !== "today");
  $("tab-history").classList.toggle("hidden", t !== "history");
  if(t === "today") renderToday(); else renderHistory();
}

/* ============ WIRING ============ */
function wire(){
  $("tb-today").addEventListener("click", function(){ switchTab("today"); });
  $("tb-history").addEventListener("click", function(){ switchTab("history"); });
  $("btn-refresh").addEventListener("click", refreshAll);
  $("livechip").addEventListener("click", function(){ if(LIVE.state === "offline") refreshAll(); });
  $("tab-history").addEventListener("click", function(ev){
    var ov = ev.target.closest("button.ov");
    if(ov){
      var date = ov.getAttribute("data-date"), pkey = ov.getAttribute("data-p"), mode = ov.getAttribute("data-mode");
      var rec = loadRecords();
      var s = rec.sessions.filter(function(x){ return x.date === date; })[0];
      if(s){
        var p = s.picks.filter(function(x){ return (x.mid + "|" + x.market) === pkey; })[0];
        if(p){
          p.manual = true; p.status = mode === "w" ? "win" : (mode === "l" ? "loss" : "void"); p.auto = false;
          saveRecords(rec);
          if(LIVE.state === "live"){ apiPost("/api/sessions/" + s.id + "/override",{pickKey:pkey, status:p.status}).catch(function(){}); }
          renderHistory();
        }
      }
      return;
    }
    var sb = ev.target.closest("button.scorebtn");
    if(sb){
      var date2 = sb.getAttribute("data-date"), mid = sb.getAttribute("data-mid"), mkt = sb.getAttribute("data-mkt");
      var inp = document.querySelector('input[data-date="' + date2 + '"][data-mid="' + mid + '"][data-mkt="' + mkt + '"]');
      var v = (inp.value || "").trim();
      var mm = v.match(/^(\d{1,2})\s*[-:]\s*(\d{1,2})$/);
      if(!mm){ inp.classList.add("bad"); return; }
      inp.classList.remove("bad");
      var rec2 = loadRecords();
      var s2 = rec2.sessions.filter(function(x){ return x.date === date2; })[0];
      if(s2){
        s2.picks.forEach(function(p){
          if(p.mid === mid && p.market === mkt){ p.score = v; if(!p.manual){ p.status = evalPick(p.type, +mm[1], +mm[2]); p.auto = false; } }
        });
        saveRecords(rec2);
        if(LIVE.state === "live"){ apiPost("/api/sessions/" + s2.id + "/score",{mid:mid, score:v}).catch(function(){}); }
        renderHistory();
        toast("SCORE " + v + " IMEFUNGWA");
      }
      return;
    }
    if(ev.target.closest("#btn-clear-hist")){
      if(!confirm("SAFISHA HISTORY YOTE?\n\nRecords zote za combos (pamoja na zile za siku za zamani) zitafutwa. Hakurudiki.")) return;
      var recClear = loadRecords();
      if(LIVE.state === "live"){
        (recClear.sessions||[]).forEach(function(s){
          try{ apiFetch("/api/sessions/" + s.id, {method:"DELETE"}).catch(function(){}); }catch(e){}
        });
      }
      recClear.sessions = [];
      saveRecords(recClear);
      renderToday();   /* leo itarekodiwa upya kutoka combo hai */
      renderHistory();
      toast("HISTORY IMESAFISHWA");
      return;
    }
    var dd = ev.target.closest("button.day-del");
    if(dd){
      var dIdx = dd.getAttribute("data-del");
      var rec3 = loadRecords();
      var days = dayBets(rec3);
      var x3 = days[+dIdx];
      if(x3 && confirm("Futa record ya " + dateSw(x3.date) + "? (hakurudiki)")){
        rec3.sessions = rec3.sessions.filter(function(y){ return y.id !== x3.id; });
        saveRecords(rec3);
        if(LIVE.state === "live"){ try{ apiFetch("/api/sessions/" + x3.id, {method:"DELETE"}).catch(function(){}); }catch(e){} }
        renderHistory();
        toast("REKODIMEFUTWA");
      }
      return;
    }
    var dh = ev.target.closest(".day-h");
    if(dh){
      var idx = dh.getAttribute("data-open");
      var body = document.querySelector('[data-body="' + idx + '"]');
      if(body) body.style.display = (body.style.display === "none" || body.style.display === "") ? "block" : "none";
    }
  });
}

/* ============ BOOT ============ */
function enterApp(){
  if(enterApp._done) return;
  enterApp._done = true;
  $("splash").classList.add("gone");
  setTimeout(function(){ $("splash").classList.add("hidden"); }, 550);
  $("app").classList.remove("hidden");
  ensureTodaySession();
  renderAll();
  wire();
  lastPicksPoll = Date.now();
  setTimeout(autoScorePicks, 2500);
  startAutoSync();
}
function boot(){
  renderTopbar();
  var t0 = Date.now();
  fetchLive(false).then(function(d){
    setLiveFrom(d);
    var wait = Math.max(0, 1900 - (Date.now() - t0));
    setTimeout(enterApp, wait);
  });
  setTimeout(function(){ setLiveFrom(null); enterApp(); }, 8000);
}
boot();
})();
</script>
