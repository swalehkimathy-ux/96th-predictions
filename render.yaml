services:
  - type: web
    name: 96th-predictions
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /api/status
    envVars:
      - key: P96_PIPELINE_DIR
        value: /opt/render/project/src/betting-researcher
      - key: P96_DB_PATH
        value: /tmp/96th/records.db
      # v7.3: auto results sasa HAITAJI key (WinComparator final scores).
      # ODDS_API_KEY sasa ni HIARI (fallback tu) — ongeza kwenye Render dashboard
      # ikiwa unataka fallback za ziada. Tafuta "Auto Results" kwenye README-RENDER.md.
