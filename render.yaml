services:
  - type: web
    name: 96th-predictions
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: python3 server.py
    healthCheckPath: /api/status
    envVars:
      - key: P96_PIPELINE_DIR
        value: /opt/render/project/src/betting-researcher
      - key: P96_DB_PATH
        value: /tmp/96th/records.db
